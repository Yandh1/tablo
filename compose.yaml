name: tablo

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tablo}
      POSTGRES_USER: ${POSTGRES_USER:-tablo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tablo_local_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - tablo_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

volumes:
  tablo_postgres_data:
    name: tablo_postgres_data
